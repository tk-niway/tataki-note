# release.sh の設定

# 署名に使う Developer ID Application 証明書の SHA-1。codesign の署名 ID に使う。
# 証明書を更新したら(有効期限は 5 年)、新しい証明書のものに替える。
SIGN_IDENTITY=CF397DBB6A9F2790D3A521058A797AE4CB71FB9F

# Apple Developer の Team ID。作った .app が、このチームの Developer ID で署名されていることを確かめる。
# macOS はアクセシビリティの許可をバンドル ID と Team ID に結び付けるので、証明書を更新しても許可は外れない。
# Team ID かバンドル ID を変えると、更新した利用者全員の許可が外れる。
TEAM_ID=VC2W729G2T

BUNDLE_ID=jp.co.woube.TatakiNote
APP_NAME=TatakiNote
