# main に VERSION・リリースノートの変更が入ったら、署名した配布物を作って下書きのリリースにする。
# 公開(Publish)は人が GitHub の Releases で確認してから行う。
name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - release-notes/**
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Xcode のメジャーバージョン。ランナーにあるこの版の中で一番新しいものを使う
  XCODE_MAJOR: "27"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether to release
        id: check
        run: ./scripts/release.sh check

      - name: Select Xcode
        if: steps.check.outputs.release == 'yes'
        run: |
          xcode="$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode ${XCODE_MAJOR} not found on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Unit tests
        if: steps.check.outputs.release == 'yes'
        run: ./scripts/release.sh test

      - name: Import signing certificate
        if: steps.check.outputs.release == 'yes'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::secret MACOS_CERT_P12_BASE64 is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # 自己署名の証明書なので、署名の検証が通るようにこのランナーでだけ信頼する
          security find-certificate -c "TatakiNote Code Signing" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign
        if: steps.check.outputs.release == 'yes'
        run: ./scripts/release.sh build --keychain "$SIGNING_KEYCHAIN"

      - name: Create draft release
        if: steps.check.outputs.release == 'yes'
        run: ./scripts/release.sh upload

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
